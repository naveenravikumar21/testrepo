# Flight fare monitor: non-secret settings.
#
# What to watch (route, dates, how often, book-now price) is NOT set here: each trip is a
# "Fare watch" issue created from the form in GitHub (Issues -> New issue -> Fare watch).
# This file only holds defaults and safety limits. Secrets (API keys) come from GitHub
# Actions secrets / environment variables and are never stored here.

[defaults]
origin = "JAI"                      # used when a watch leaves "From" empty
destination = "COK"                 # used when a watch leaves "To" empty
adults = 1
cabin = "economy"
currency = "INR"
timezone = "Asia/Kolkata"
target_fare_inr = 0                 # book-now price when a watch leaves it empty (0 = none)
max_stops = 2                       # most stops any search will include

[local]
# Only for running on your own computer without GitHub: dates to check (or set TRAVEL_DATES).
dates = []
target_fare_inr = 0

[preferences]
# Options outside these limits are discarded (applies to every watch).
max_duration_hours = 18
earliest_departure = "00:00"        # local time at the departure airport
latest_departure = "23:59"
min_layover_minutes = 45            # shorter connections are too risky
max_layover_minutes = 600
# "Best value" = fare + value_inr_per_hour x journey hours + value_inr_per_stop x stops.
# Shown on the dashboard as a recommendation; alerts are always about price.
value_inr_per_hour = 300
value_inr_per_stop = 750
store_top_n = 20                    # options stored per route/date/check

[verification]
# A price must reach this level before it can be a record low or trigger an alert:
#   verified       live bookable offer re-priced through a booking API (Duffel, optional)
#   seller_quoted  final price quoted by a named seller (airline / OTA) via Google Flights
#   indicative     search-result price only (never recommended for alerts)
alert_min_status = "seller_quoted"  # ALERT_MIN_STATUS
reverify_after_hours = 72           # re-confirm an unchanged under-target fare at most this often
min_plausible_fare = 1000           # sanity bounds: anything outside is rejected as a data error
max_plausible_fare = 150000
stale_after_days = 8                # older prices are labelled stale on the dashboard

[alerts]
min_drop_inr = 200                  # a new record low must beat the previous low by at least this...
min_drop_pct = 2.0                  # ...and by at least this percentage
competitive_pct = 5.0               # "new flight" alerts only within this % of the current lowest
reappear_after_days = 3             # a flight unseen this long counts as "previously unavailable"
health_alert_after_failures = 2     # consecutive fully-failed checks before a problem notice

[budget]
# SerpApi free plan = 250 searches per month. Every Google Flights search for one date = 1 search;
# confirming a seller's final price = 1 more search (only done when a fare might trigger an alert).
monthly_search_limit = 250          # SERPAPI_MONTHLY_LIMIT
safety_margin = 20                  # stop searching when fewer than this many searches are left
max_dates_per_watch = 14

[providers]
enabled = ["serpapi_google_flights"]   # add "duffel" if you have a live Duffel token

[providers.serpapi_google_flights]
deep_search = true                  # matches results shown in a browser more closely (slower)
booking_checks_per_date = 1         # at most this many seller confirmations per date per check

[providers.duffel]
max_connections = 2
supplier_timeout_ms = 20000
verify_top_n = 1

[notify]
# github  = post on the watch's issue; GitHub emails you (and notifies the GitHub app)
# email   = SMTP (needs SMTP_* secrets), telegram = Telegram bot, console = log only
channels = ["github"]               # NOTIFY_CHANNELS

[github]
watch_title_prefix = "[Fare watch]"
watch_label = "fare-watch"
# Only issues opened by these people count as watches (strangers can open issues on public repos).
allowed_author_associations = ["OWNER", "MEMBER", "COLLABORATOR"]
