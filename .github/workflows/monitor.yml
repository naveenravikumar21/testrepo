name: Fare monitor

on:
  schedule:
    - cron: "35 1 * * *"          # every day 01:35 UTC = 07:05 IST; each watch decides if today is a check day
  issues:
    types: [opened, edited, reopened]   # new or changed "Fare watch" issues are checked right away
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options:
          - check watches that are due
          - check all watches now
          - dry run (no posting, no saving)
        default: check watches that are due

permissions:
  contents: write                 # save the database snapshot to the fare-data branch
  issues: write                   # post alerts/status on watch issues (GitHub emails you)
  pages: write                    # publish the dashboard
  id-token: write

concurrency:
  group: fare-monitor
  cancel-in-progress: false       # never run two checks against the same database at once

env:
  STATE_BRANCH: fare-data
  FARE_STATE_DIR: state
  PYTHONUNBUFFERED: "1"

jobs:
  monitor:
    # Issue events: only "Fare watch" issues opened by the owner/collaborators (strangers can open issues
    # on a public repository; they must not be able to spend your searches).
    if: >-
      vars.MONITOR_ENABLED != 'false' && (
        github.event_name != 'issues' || (
          (startsWith(github.event.issue.title, '[Fare watch]') ||
           contains(github.event.issue.labels.*.name, 'fare-watch')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database from the fare-data branch
        id: restore
        run: |
          set -euo pipefail
          mkdir -p state
          rc=0
          git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --depth 1 origin "$STATE_BRANCH"
            git archive FETCH_HEAD | tar -x -C state
            test -s state/fares.sqlite3 || { echo "::error::State branch exists but has no database"; exit 1; }
            echo "Restored state from $STATE_BRANCH"
          elif [ "$rc" -eq 2 ]; then
            echo "No state branch yet: starting a fresh database"
          else
            echo "::error::Could not read the state branch (git exit $rc); refusing to run without history"
            exit 1
          fi

      - name: Check fares
        id: run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS }}
          PROVIDERS: ${{ vars.PROVIDERS }}
          ALERT_MIN_STATUS: ${{ vars.ALERT_MIN_STATUS }}
          SERPAPI_MONTHLY_LIMIT: ${{ vars.SERPAPI_MONTHLY_LIMIT }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          args=(run --trigger "$EVENT")
          [ "$EVENT" = "issues" ] && args+=(--issue "$ISSUE")
          case "$MODE" in
            "check all watches now") args+=(--check-now) ;;
            "dry run"*)              args+=(--dry-run) ;;
          esac
          python -m fare_monitor "${args[@]}"

      - name: Save database snapshot to the fare-data branch
        # Runs even when the check failed, so failure counters and partial results are kept.
        if: always() && steps.restore.outcome == 'success' && !startsWith(inputs.mode, 'dry run')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s state/fares.sqlite3 || { echo "No database produced; nothing to save"; exit 0; }
          cd state
          git init -q -b "$STATE_BRANCH"
          git config user.name "fare-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Fare monitor state $(date -u +%Y-%m-%dT%H:%MZ) (run ${GITHUB_RUN_ID})"
          # One snapshot commit, force-pushed: the full history lives inside the database.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${STATE_BRANCH}"

      - name: Back up database as a workflow artifact
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fare-state-${{ github.run_id }}
          path: state/
          retention-days: 14
          if-no-files-found: ignore

      - name: Prepare dashboard
        id: site
        if: always() && steps.restore.outcome == 'success' && !startsWith(inputs.mode, 'dry run')
        run: |
          mkdir -p site
          if [ -f state/index.html ]; then cp state/index.html site/index.html; fi
          test -f site/index.html

      - name: Upload dashboard
        if: always() && steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish dashboard (GitHub Pages)
        # Needs Settings -> Pages -> Source: "GitHub Actions" (one-time). Never fails the check itself.
        if: always() && steps.site.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
